# fly.toml app configuration file for MedamaLite
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
app = 'medamalite'
primary_region = 'lhr'

swap_size_mb = 1024

[build]
image = 'ghcr.io/medama-io/medamalite:edge'

[env]
ANALYTICS_DATABASE_HOST = '/db/analytics.db'
APP_DATABASE_HOST = '/db/app.db'
PORT = '8080'
LEVEL = 'debug'
PROFILER = 'true'

[[mounts]]
source = 'medamalite_db'
destination = '/db'

[http_service]
internal_port = 8080
force_https = true
auto_start_machines = true
min_machines_running = 1
processes = ['app']

[[vm]]
memory = '1024mb'
cpu_kind = 'shared'
cpus = 1
